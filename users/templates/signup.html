<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up - ECommerce</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
</head>

<body>
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Navbar</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
        aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
        <div class="navbar-nav">
          <a class="nav-link active" aria-current="page" href="#">Home</a>
        </div>
        <div class="navbar-nav">
          <a class="nav-link" aria-current="page" href="/users/login">Login</a>
        </div>
        <div class="navbar-nav">
          <a class="nav-link" aria-current="page" href="/users/signup">Sign up</a>
        </div>
      </div>
    </div>
  </nav>
  <main>
    <div class="container">
      <form method="post" action="/users/signup" class="row mt-4">
        {% csrf_token %}
        <div class="col col-lg-4 offset-lg-4 col-md-6 offset-md-3 col-10 offset-1">
          <div class="card shadow-lg">
            <div class="card-body p-4">
              <div class="mb-5 mt-3">
                <h3 class="text-center">Sign up</h3>
              </div>
              <div class="mb-4">
                <label for="email" class="form-label">Email address</label>
                <input name="email" type="email" class="form-control" id="email" placeholder="name@example.com" />
              </div>
              <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <input name="password" type="password" class="form-control" id="password" placeholder="Strong password" />
              </div>
              <div class="mb-4">
                <label for="confirm-password" class="form-label">Confirm Password</label>
                <input name="confirm-password" type="password" class="form-control" id="confirm-password" placeholder="Strong password" />
              </div>
              <div class="mb-4 d-grid">
                <button type="submit" class="btn btn-success">Submit</button>
              </div>
            </div>
          </div>
        </div>
      </form>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
