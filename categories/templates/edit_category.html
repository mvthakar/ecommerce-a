{% include 'header.html' %}
<div class="container">
  <form method="post" action="{% url 'edit-category' %}" class="row mt-5">
    {% csrf_token %}
    <div class="col col-lg-4 offset-lg-4 col-md-6 offset-md-3 col-10 offset-1">
      <div class="card shadow">
        <div class="card-body p-4">
          <div class="mb-5 mt-3">
            <h3 class="text-center">Edit a Category</h3>
          </div>
          <input type="hidden" name="id" value="{{ category_to_edit.id }}">
          <div class="mb-4">
            <label for="name" class="form-label">Category Name</label>
            <input value="{{ category_to_edit.name }}" required name="name" type="text" class="form-control" id="name" placeholder="Abc Xyz" />
          </div>
          <div class="mb-4">
            <label for="parent-category" class="form-label">Parent Category</label>
            <select class="form-select" name="parent-category" id="parent-category">
              <option value="">[No parent]</option>
              {% for category in categories %}
                <option {% if category_to_edit.parent_category.id == category.id %}{{ "selected" }}{% endif %} value="{{ category.id }}">{{ category.name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-4 d-grid">
            <button type="submit" class="btn btn-success">Submit</button>
          </div>
        </div>
      </div>
    </div>
  </form>
  {% if error is not None %}
  <div class="row mt-4">
    <div class="col col-lg-4 offset-lg-4 col-md-6 offset-md-3 col-10 offset-1">
      <div class="alert alert-danger mb-0 alert-dismissible fade show shadow" role="alert">
        {{ error }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
    </div>
  </div>
  {% endif %}
</div>
{% include 'footer.html' %}
