{% include 'header.html' %}
<div class="container">
  <form method="post" action="{% url 'edit-product' %}" class="row mt-5">
    {% csrf_token %}
    <div class="col col-lg-4 offset-lg-4 col-md-6 offset-md-3 col-10 offset-1">
      <div class="card shadow">
        <div class="card-body p-4">
          <div class="mb-5 mt-3">
            <h3 class="text-center">Edit Product</h3>
          </div>
          <input type="hidden" name="id" value="{{ product.id }}">
          <div class="mb-4">
            <label for="name" class="form-label">Product Name</label>
            <input required value="{{ product.name }}" name="name" type="text" class="form-control" id="name" placeholder="Abc Xyz" />
          </div>
          <div class="mb-4">
            <label for="price" class="form-label">Product Price</label>
            <input required value="{{ product.price }}" name="price" type="number" class="form-control" id="price" placeholder="000" />
          </div>
          <div class="mb-4">
            <label for="category" class="form-label">Category</label>
            <select class="form-select" name="category" id="category">
              {% for category in categories %}
                <option {% if product_to_edit.category.id == category.id %}{{ "selected" }}{% endif %} value="{{ category.id }}">{{ category.name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-4 d-grid">
            <button type="submit" class="btn btn-success">Submit</button>
          </div>
        </div>
      </div>
    </div>
  </form>
  {% if error is not None %}
  <div class="row mt-4">
    <div class="col col-lg-4 offset-lg-4 col-md-6 offset-md-3 col-10 offset-1">
      <div class="alert alert-danger mb-0 alert-dismissible fade show shadow" role="alert">
        {{ error }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
    </div>
  </div>
  {% endif %}
</div>
{% include 'footer.html' %}
